<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="unnamed-modified.png" type="image/png">
    <title>NB42's Website</title>

<body>
    <style>
        body {
            background-color: rgb(247, 251, 255);
        }

        .wrap {
            font-family: Calibri, 'Trebuchet MS', sans-serif;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        input {
            font-family: Calibri, 'Trebuchet MS', sans-serif;
            border: 1px solid;
            border-color: rgb(148, 163, 178);
            border-radius: 2.5px;

            transition: border 0.5s ease;
        }

        input:focus {
            outline-color: rgb(76, 115, 145);
        }

        input:hover {
            border-color: rgb(76, 115, 145);
        }

        button {
            font-family: Calibri, 'Trebuchet MS', sans-serif;
            cursor: default;
            background-color: white;
            border: 1px solid rgb(148, 163, 178);
            border-radius: 2.5px;

            transition: all 0.5s ease;
        }

        button:hover {
            cursor: pointer;
            background-color: rgb(226, 238, 246);
            color: rgb(95, 118, 133);
        }

        h2 {
            cursor: default;
        }

        #wrapitall {
            background-color: white;
            border: 2.5px solid rgb(185, 191, 197);
            border-radius: 25px;
            box-shadow: 0px 10px 35px 10px rgba(64, 71, 79, 0.25);
        }

        hr {
            border: 1px solid rgb(185, 191, 197);
        }

        h1, h3, p {
            cursor: default;
        }

        a {
            color: black;
            cursor: pointer;
            text-decoration: underline;
        }

    </style>

    <div class="wrap" id="wrapitall">
        <h1>Numberblock 42's Website</h1>
        <p>Version 1.0.15 [bug fix #1]</p>

            <br>

            <label>-</label>
            <a href="articles.html">Our articles</a>
        </div>
        <hr>
        <label style="color: rgb(125, 131, 142)">All caught up!</label>
        <p></p>
    </div>
    <br>

    </script>
</body>
</html>
